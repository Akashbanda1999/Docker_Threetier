services:
    medi:
      build: .
      ports:
        - '80:80'
      container_name: Medicontainer
      volumes:
        - myapp1:/var/www/html/
      network_mode: 
          bridge

    healet:
      build: ./health/
      ports:
        - '8080:80'
      container_name: Healetcontainer
      volumes:
        - myapp2:/var/www/html/
      network_mode: 
          bridge

volumes:
   myapp1:
   myapp2:

